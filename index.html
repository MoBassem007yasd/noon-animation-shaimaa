<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;      /* removes the page scrollbar */
      background: #fff;
    }
    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;   /* fits the full video inside the frame, no cropping */
      pointer-events: none;
    }
  </style>
</head>
<body>
  <video src="noon-login-animation.mp4" autoplay muted loop playsinline></video>
</body>
</html>
